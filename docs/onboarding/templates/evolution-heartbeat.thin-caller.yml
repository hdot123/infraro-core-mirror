# Evolution Heartbeat thin caller（消费仓模板）
# 复制后保持 name: Evolution Heartbeat 与 cron '47 */2 * * *'（INFRA-578 错峰）。

name: Evolution Heartbeat

on:
  schedule:
    - cron: '47 */2 * * *'
  workflow_dispatch: {}

concurrency:
  group: evolution-heartbeat
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  heartbeat:
    uses: hdot123/infraro-core/.github/workflows/evolution-heartbeat.yml@2225716d6b1b80c354180e766ac79e4220dbd941 # v0.18.4
    permissions:
      contents: read
      issues: write
    secrets:
      dispatch_token: ${{ secrets.DISPATCH_TOKEN }}
