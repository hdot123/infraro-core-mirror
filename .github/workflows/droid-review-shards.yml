# Droid Review Shards — reusable shard pipeline（自仓收敛承载 + memory-core 等
# thin caller 双消费；B-1 收敛 2026-10-05）
#
# B-1 收敛：自仓 droid-review.yml 的分片执行段（setup / plan-shards /
# review-shard 内联三 job）已收敛为对本文 workflow_call 的调用（单源）。
# 本文成为分片实现的唯一载体，双路消费：
#   - 跨仓 thin caller（memory-core 等）：mirror tag pin（v0.19.0 行为不变）
#   - 自仓壳 droid-review.yml：./.github/ 本地调用，按 main 当前 commit 解析
#     （B-2 auto-merge 壳同款先例；pull_request_target 的 workflow 定义面本就
#     取 BASE 快照，与收敛前壳内 BASE checkout 的脚本取源语义一致）
#
# 被调用时承接 setup / plan-shards / review-shard 三个 job。聚合发布（check
# 名 `droid-review` 的 job）不在本文件——reusable workflow 内部 job 的
# check 名是 `外层/内层` 嵌套格式，精确名契约必须由 caller 本地 job 承载
# （VAL-GATE-103；自仓聚合 job 在 droid-review.yml 本地）。
#
# 三个契约（本文件承载其中两个，NEVER break）：
#   1. Workflow 名 "Droid Auto Review"（caller 侧，本文件只承接分片流水线）
#   2. Artifact 前缀 "droid-review-debug-"（watchdog quota-sweep 依赖，本文件上传）
#   3. 聚合 job key `droid-review`（caller 本地 job，绝不进本文件）
#
# 脚本取源（单一形态，无路径分支）：plan_shards.py 与 run_shard.sh 一律
# 取自 engine checkout（engine/src/infra_core/engine/droid_review/），
# 自仓 ./.github/ 本地调用与跨仓 thin caller 两路同形——两路差异仅是
# engine ref 解析结果不同（job.workflow_sha 的解析仓不同），取源路径
# 完全一致。跨仓差异由 engine_ref input 显式承载（mirror tag pin），不在
# 本文件内做路径分支；仓内 venv composite 属消费仓（如自仓 ci.yml）的
# 职责，本流水线零 venv 依赖（python3 裸跑 + 宿主 gh）。
#
# 预算参数（SHARD_MAX_* / SHARD_TIMEOUT_MINUTES / SHARD_MAX_PARALLEL）由
# caller 以 inputs 转发（自仓壳读 vars.* 后显式传递；显式传递避免隐式依赖）。
name: Droid Review Shards

# 禁止顶层 concurrency（INFRA-626）：reusable 携带顶层 concurrency 会与 caller
# 顶层组名组合触发 GitHub run 级自死锁检测（evolution 系 #1071 首 tick 实测，
# caller 'evolution-scan' × callee 同名组 → 零 job 秒取消）。per-repo 串行化/
# 去重归 caller 顶层 concurrency。通用禁令由 test_naming_contract.py
# TestReusableNoTopLevelConcurrency 对全部 workflow_call 文件锁定。
#
# 历史注（编排器注 2026-08-29，随 INFRA-626 移除）：本文件曾带
# dr-${{ inputs.head_sha || github.event.pull_request.head.sha || github.run_id }}
# 做 caller 级同 head 去重（PR #61 实测同 head 3 条并行 run）——迁移理由：被调
# workflow 的顶层 concurrency 在 caller 组名不同时同样生效，跨仓同名 caller
# 组合一撞即死锁；同 head 去重若消费仓需要，应在 caller 顶层 group 中按
# head SHA 表达（caller 侧模板测试锁定），reusable 侧一律不携带。

on:
  workflow_call:
    # Snake-only 声明（SNAKE-CONVERGENCE）：统一采用 snake_case 键名，
    # 消除 hyphen 变体过渡形态，保持接口简洁。
    inputs:
      engine_ref:
        description: 'infra-core ref for engine scripts (plan_shards.py / run_shard.sh); default = empty → job.workflow_sha (caller pin anchor)'
        required: false
        type: string
        default: ''
      pr_number:
        description: 'PR number (workflow_dispatch passthrough; empty for pull_request_target)'
        required: false
        type: string
        default: ''
      head_sha:
        description: 'Head SHA override (workflow_dispatch passthrough)'
        required: false
        type: string
        default: ''
      shard_max_files:
        description: 'Layer 3: shard size cap in files (caller 转发 vars.SHARD_MAX_FILES)'
        required: false
        type: string
        default: '25'
      shard_max_count:
        description: 'Layer 3: shard count cap (caller 转发 vars.SHARD_MAX_COUNT)'
        required: false
        type: string
        default: '6'
      shard_timeout_minutes:
        description: 'Layer 1: shard job timeout in minutes (caller 转发 vars.SHARD_TIMEOUT_MINUTES)'
        required: false
        type: string
        default: '45'
      shard_max_parallel:
        description: 'Layer 4: matrix concurrency cap (caller 转发 vars.SHARD_MAX_PARALLEL)'
        required: false
        type: string
        default: '3'
    outputs:
      pr_number:
        description: 'Resolved PR number'
        value: ${{ jobs.setup.outputs.pr_number }}
      base_sha:
        description: 'PR base SHA'
        value: ${{ jobs.setup.outputs.base_sha }}
      head_sha:
        description: 'PR head SHA'
        value: ${{ jobs.setup.outputs.head_sha }}
      docs_only:
        description: 'true 当 PR 只改 *.md（skip 模型 review）'
        value: ${{ jobs.plan-shards.outputs.docs_only }}
      shards:
        description: '分片计划 JSON 数组（docs-only 或空计划时为 [] / 空）'
        value: ${{ jobs.plan-shards.outputs.shards }}
      plan_shards_ok:
        description: "plan-shards job 是否 success（caller 聚合 job 的 if 门；skipped/failure → 空，保持 `needs.plan-shards.result == 'success'` 语义）"
        value: ${{ jobs.plan-shards.outputs.plan_ok }}
    secrets:
      factory_api_key:
        description: 'Factory API key（droid exec 凭证）'
        required: true
      opencode_go_key:
        description: 'OpenCode Go 订阅 key（BYOM Authorization 透传）'
        required: true
      go_github_run_token:
        description: 'go-github AI Gateway run token（cf-aig-authorization 认证）'
        required: true
      worker_ci_key:
        description: 'droid-review-gateway Worker CI_KEY（x-ci-key 门禁头，2026-09-27 F2）。required: false 是有意的——门禁单一真源在 Worker（缺失即 401 fail-closed），声明面不做二次判定，避免 tag 落后的 caller 在 bump pin 时直接 startup_failure。'
        required: false

# F4/INFRA-688: 显式最小权限基线——三个 job 均已带 job 级声明；顶层基线兜底
# 未来新增 job 忘记声明时回落到只读（而非仓库默认权限）。
permissions:
  contents: read

jobs:
  # ── Job 0: 引擎消费授权门（m6-engine-authorization-gate）──
  # 判定：本仓 repo variable ENGINE_CONSUMERS 含 authorized 令牌即放行；
  # 引擎仓 hdot123/infraro-core-mirror 自身豁免。未授权 → fail-loud（下游 job 因
  # needs 不启动）。凭证面：GITHUB_TOKEN 只读 actions:read，不消费 PAT。
  # 秒级 job，不延长管线。自仓壳与跨仓 thin caller 两路消费都经此门——
  # 判定目标 repo 全名取 caller 事件上下文。
  # 形态裁定（INFRA-1317）：判定脚本内联——零 checkout 载体上 composite
  # action 无法解析（run 37305718689 实证），reusable 嵌套调用被平台拒绝
  # （P0 第一轮实证）；脚本四载体逐字节一致（契约测试锁定，改一处必须
  # 四处同改）。composite action 目录已删除。
  authorization-gate:
    name: authorization-gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    steps:
      - name: Verify engine consumer authorization
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.event.repository.full_name || github.repository }}
          VARS_VALUE: ${{ vars.ENGINE_CONSUMERS || '' }}
        run: |
          set -euo pipefail

          # 引擎授权门（engine authorization gate）——消费仓未授权时在管线入口
          # fail-loud，不静默跳过。判定链：
          #   ① 引擎仓自身豁免（默认 hdot123/infraro-core-mirror）
          #   ② 优先用 vars 上下文值（caller 仓 repo variable，零权限、零 API 调用）
          #   ③ 回退 gh api 读 repo variable（需 token 具备 Variables 读权限；
          #      GITHUB_TOKEN 实测无该权限 → 403，故仅作回退/诊断路径）
          #   ④ 未授权 / 读取失败 → 失败（fail-closed，不静默放行）
          REPO="${REPO:-${GITHUB_REPOSITORY:-}}"
          VARS_VALUE="${VARS_VALUE:-}"
          VARIABLE_NAME="${ENGINE_AUTHORIZATION_VARIABLE:-ENGINE_CONSUMERS}"
          AUTHORIZED_TOKEN="${ENGINE_AUTHORIZATION_TOKEN:-authorized}"
          EXEMPT_REPOS="${ENGINE_AUTHORIZATION_EXEMPT_REPOS:-hdot123/infraro-core-mirror}"
          ALERT="未授权消费引擎，走授权流程"

          if [ -z "${REPO}" ]; then
            echo "::error::${ALERT}：无法解析本仓 full_name（REPO / GITHUB_REPOSITORY 均为空）"
            exit 1
          fi

          for exempt in ${EXEMPT_REPOS}; do
            if [ "${REPO}" = "${exempt}" ]; then
              echo "Authorization gate: ${REPO} 是引擎仓自身，豁免授权检查（exempt）"
              exit 0
            fi
          done

          matches_token() {
            IFS=',' read -r -a TOKENS <<<"$1" || true
            for token in "${TOKENS[@]:-}"; do
              if [ "$(printf '%s' "${token}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')" = "${AUTHORIZED_TOKEN}" ]; then
                return 0
              fi
            done
            return 1
          }

          if matches_token "${VARS_VALUE}"; then
            echo "Authorization gate: ${REPO} authorized（${VARIABLE_NAME}=${VARS_VALUE} @vars）"
            exit 0
          fi

          RAW="$(mktemp)"
          rc=0
          gh api "repos/${REPO}/actions/variables/${VARIABLE_NAME}" >"${RAW}" 2>&1 || rc=$?
          if [ "${rc}" -eq 0 ]; then
            VALUE="$(jq -r '.value // ""' <"${RAW}")"
            rm -f "${RAW}"
            if matches_token "${VALUE}"; then
              echo "Authorization gate: ${REPO} authorized（${VARIABLE_NAME}=${VALUE} @api）"
              exit 0
            fi
            echo "::error::${ALERT}：${REPO} 的 ${VARIABLE_NAME} 当前值为 '${VALUE}'，未包含授权令牌 '${AUTHORIZED_TOKEN}'"
            exit 1
          fi

          if grep -q "404" "${RAW}"; then
            echo "::error::${ALERT}：${REPO} 未设置 repo variable ${VARIABLE_NAME}（vars 上下文值亦为空；授权四步：variable → PAT → runner → 6 阶段验收）"
          else
            echo "::error::${ALERT}：${REPO} 授权状态不可读（vars 上下文值为空，rc=${rc}）：$(head -c 400 "${RAW}")"
          fi
          rm -f "${RAW}"
          exit 1

  setup:
    needs: authorization-gate
    permissions:
      contents: read
      # workflow_dispatch 路径的 PR 上下文解析（gh api pulls/…）需要
      # pull-requests: read；reusable 内部声明的有效面 = caller 授予 ∩
      # 本声明，缺此键时 manual dispatch 将以 403 fail-closed（caller
      # shards job 已授予，此处必须对齐声明）。
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      draft: ${{ steps.resolve.outputs.draft }}
      user_login: ${{ steps.resolve.outputs.user_login }}
    steps:
      - name: Resolve PR context
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Fork guard (fail-closed): reject pull_request_target from forks.
          # pull_request_target checks out PR head code on self-hosted runners
          # with API keys in env — fork authors could manipulate review via
          # malicious AGENTS.md. Empty head.repo also rejected (fail-closed).
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "::error::fork PR rejected by droid-review fork guard (head=${{ github.event.pull_request.head.repo.full_name }}, repo=${{ github.repository }})"
              exit 1
            fi
          fi

          # Dispatch branch whitelist guard (fail-closed, step level).
          # B-1 收敛自自仓壳 setup（单一实现落位本文件）：workflow_dispatch
          # from non-whitelisted branches must fail with exit 1, not just
          # produce 'skipped' via if:-guard. 引擎仓 main/hotfix/feature 白名单
          # 与跨仓 thin caller 的 main dispatch 兼容。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ github.ref }}"
            case "$BRANCH" in
              refs/heads/main|refs/heads/hotfix/*|refs/heads/feature/*)
                echo "Dispatch branch $BRANCH is whitelisted"
                ;;
              *)
                echo "::error::workflow_dispatch rejected by droid-review dispatch guard (ref=${BRANCH})"
                exit 1
                ;;
            esac
          fi

          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            # pull_request_target trigger: use event context
            {
              echo "pr_number=${{ github.event.pull_request.number }}"
              echo "base_sha=${{ github.event.pull_request.base.sha }}"
              echo "head_sha=${{ github.event.pull_request.head.sha }}"
              echo "draft=${{ github.event.pull_request.draft }}"
              echo "user_login=${{ github.event.pull_request.user.login }}"
            } >> "$GITHUB_OUTPUT"
            echo "Resolved PR context from pull_request_target event"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # workflow_dispatch trigger: fetch PR data via API
            PR_NUMBER="${{ inputs.pr_number }}"
            echo "Fetching PR #$PR_NUMBER data via API..."

            PR_DATA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
            BASE_SHA=$(echo "$PR_DATA" | jq -r '.base.sha')
            HEAD_SHA="${{ inputs.head_sha }}"
            if [ -z "$HEAD_SHA" ] || [ "$HEAD_SHA" = "null" ]; then
              HEAD_SHA=$(echo "$PR_DATA" | jq -r '.head.sha')
            fi
            DRAFT=$(echo "$PR_DATA" | jq -r '.draft')
            USER_LOGIN=$(echo "$PR_DATA" | jq -r '.user.login')

            {
              echo "pr_number=$PR_NUMBER"
              echo "base_sha=$BASE_SHA"
              echo "head_sha=$HEAD_SHA"
              echo "draft=$DRAFT"
              echo "user_login=$USER_LOGIN"
            } >> "$GITHUB_OUTPUT"
            echo "Resolved PR context from workflow_dispatch (PR #$PR_NUMBER, head=$HEAD_SHA)"
          else
            echo "::error::Unsupported event name: ${{ github.event_name }}"
            exit 1
          fi

  # ── Job 1: Plan shards (no model call, ~1min) ──
  plan-shards:
    needs: setup
    if: needs.setup.outputs.draft == 'false' && needs.setup.outputs.user_login != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      docs_only: ${{ steps.docs_only.outputs.skip }}
      plan_ok: ${{ steps.plan_gate.outputs.plan_ok }}
    steps:
      - name: Workspace guard (sparse residue detox)
        run: |
          set -euo pipefail
          # 2026-08-28 污染事故运行时排毒：共享持久 _work 工作区的 sparse 残留
          # 使 checkout 无法恢复被裁剪的工作树。reusable 版探针用 .github/workflows
          # （语言中立的共有目录；用本仓特有路径做探针会造成消费仓
          # 每 run 全量重克隆）。
          if [ -e "$GITHUB_WORKSPACE/.git" ]; then
            SPARSE_FLAG=$(git -C "$GITHUB_WORKSPACE" config --type=bool --get core.sparseCheckout 2>/dev/null || echo false)
            if [ "$SPARSE_FLAG" = "true" ] || [ ! -d "$GITHUB_WORKSPACE/.github/workflows" ]; then
              echo "::warning::Workspace has sparse/prune residue; removing .git for a clean re-clone"
              rm -rf "$GITHUB_WORKSPACE/.git"
            fi
          fi

      - name: Checkout engine (infraro-core)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: hdot123/infraro-core-mirror
          # SHA 真源模型（与 evolution-scan.yml 引擎安装步同构）：job.workflow_sha
          # 在 workflow_call 下恒有值且 = caller uses@tag 解析出的本 reusable 文件
          # commit（硬证据：mencbo scan run 34065944470 日志三值 ENGINE_REF/
          # job.workflow_sha 同为 b56c2c7…、github.sha=1920948 为消费仓 commit）；
          # 末尾 github.sha 是响亮失败兜底——上游两值意外皆空时消费仓 commit 在
          # infraro-core 不存在 → checkout 硬错，防止 ref 空串 + 异仓 checkout
          # 静默回落默认分支（= 又浮 main）。
          ref: ${{ inputs.engine_ref || job.workflow_sha || github.sha }}
          fetch-depth: 1
          path: engine

      - name: Detect docs-only PR
        id: docs_only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.setup.outputs.pr_number }}
        run: |
          set -euo pipefail
          echo "Detecting whether PR #$PR_NUMBER changes only docs files (*.md)..."
          FILES=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
          if [ -z "$FILES" ]; then
            echo "File list empty or API failure — fail-closed, run full review"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NON_MD=$(echo "$FILES" | grep -v '\.md$' || true)
          if [ -z "$NON_MD" ]; then
            echo "docs-only=true — all changed files are *.md, skipping model review"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only=false — non-md files present:"
            echo "$NON_MD"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan shards
        id: plan
        if: steps.docs_only.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.setup.outputs.pr_number }}
          MAX_FILES: ${{ inputs.shard_max_files }}
          MAX_COUNT: ${{ inputs.shard_max_count }}
        run: |
          set -euo pipefail
          # Get changed files from PR (with status for deleted-file handling)
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --paginate --jq '.[] | .filename + "\t" + .status' > changed_files_with_status.txt
          # Extract just filenames for planner
          cut -f1 changed_files_with_status.txt > changed_files.txt
          # Filter out docs-only files
          grep -v '\.md$' changed_files.txt > code_files.txt || true
          # Run planner（引擎副本；CWD 为消费仓工作区，文件清单落在此处）
          if [ -s code_files.txt ]; then
            PLAN=$(python3 engine/src/infra_core/engine/droid_review/plan_shards.py "$MAX_FILES" "$MAX_COUNT" < code_files.txt)
            echo "Plan output: $PLAN"
            echo "shards=$(echo "$PLAN" | jq -c '.shards')" >> "$GITHUB_OUTPUT"
          else
            echo "shards=[]" >> "$GITHUB_OUTPUT"
          fi
          # Save file statuses for shard scripts (deleted files need special handling)
          cp changed_files_with_status.txt /tmp/file_statuses.txt

      - name: Upload file statuses
        if: always() && steps.docs_only.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: file-statuses-${{ github.run_id }}
          path: /tmp/file_statuses.txt
          retention-days: 1

      - name: Mark plan gate ok
        # 末步置位（无 if，正常完成才执行）：job skipped/failure 时该输出为空，
        # caller 以 plan_shards_ok == 'true' 判定，等价旧 `needs.plan-shards.result == 'success'`
        id: plan_gate
        run: echo "plan_ok=true" >> "$GITHUB_OUTPUT"

  # ── Job 2: Review shard matrix (parallel, model call) ──
  review-shard:
    needs: [setup, plan-shards]
    if: >-
      needs.plan-shards.outputs.docs_only != 'true' &&
      needs.plan-shards.outputs.shards != '[]' &&
      needs.plan-shards.outputs.shards != ''
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.shard_timeout_minutes) }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.shard_max_parallel) }}
      matrix:
        shard: ${{ fromJSON(needs.plan-shards.outputs.shards) }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Workspace guard (sparse residue detox)
        run: |
          set -euo pipefail
          # 2026-08-28 污染事故运行时排毒（探针同 plan-shards：.github/workflows）
          if [ -e "$GITHUB_WORKSPACE/.git" ]; then
            SPARSE_FLAG=$(git -C "$GITHUB_WORKSPACE" config --type=bool --get core.sparseCheckout 2>/dev/null || echo false)
            if [ "$SPARSE_FLAG" = "true" ] || [ ! -d "$GITHUB_WORKSPACE/.github/workflows" ]; then
              echo "::warning::Workspace has sparse/prune residue; removing .git for a clean re-clone"
              rm -rf "$GITHUB_WORKSPACE/.git"
            fi
          fi

      - name: Checkout repository (BASE)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.setup.outputs.base_sha }}
          fetch-depth: 0

      - name: Checkout PR head (HEAD → head-src/)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.setup.outputs.head_sha }}
          fetch-depth: 0
          path: head-src

      - name: Checkout engine (infraro-core)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: hdot123/infraro-core-mirror
          # SHA 真源模型（与 evolution-scan.yml 引擎安装步同构）：job.workflow_sha
          # 在 workflow_call 下恒有值且 = caller uses@tag 解析出的本 reusable 文件
          # commit（硬证据：mencbo scan run 34065944470 日志三值 ENGINE_REF/
          # job.workflow_sha 同为 b56c2c7…、github.sha=1920948 为消费仓 commit）；
          # 末尾 github.sha 是响亮失败兜底——上游两值意外皆空时消费仓 commit 在
          # infraro-core 不存在 → checkout 硬错，防止 ref 空串 + 异仓 checkout
          # 静默回落默认分支（= 又浮 main）。
          ref: ${{ inputs.engine_ref || job.workflow_sha || github.sha }}
          fetch-depth: 1
          path: engine

      - name: Set shard environment
        id: shard_env
        env:
          SHARD_FILE_JSON: ${{ toJson(matrix.shard.files) }}
          SHARD_ID_VAL: ${{ matrix.shard.shard_id }}
          BASE_SHA: ${{ needs.setup.outputs.base_sha }}
          HEAD_SHA: ${{ needs.setup.outputs.head_sha }}
        run: |
          set -euo pipefail

          # (A) Fix: Use GITHUB_ENV multi-line delimiter for SHARD_FILES.
          # The runner reads the literal value between delimiters — no quote
          # stripping. Previous version used echo "SHARD_FILES='$JSON'" which
          # embedded literal single quotes into the env var, breaking jq.
          {
            echo "SHARD_ID=$SHARD_ID_VAL"
            echo "BASE_REF=$BASE_SHA"
            echo "HEAD_REF=$HEAD_SHA"
            echo "RUN_ID=${{ github.run_id }}"
            printf 'SHARD_FILES<<EOF_SHARD\n%s\nEOF_SHARD\n' "$SHARD_FILE_JSON"
          } >> "$GITHUB_ENV"

          # Compute merge-base within head-src after fetching base SHA
          cd head-src
          git config --global --add safe.directory "$GITHUB_WORKSPACE/head-src"

          # Fetch the base SHA explicitly so merge-base can resolve it
          # NOTE: Do NOT use --depth=1 here! Shallow fetch writes the base SHA
          # into .git/shallow, causing merge-base to return empty when the base
          # branch has advanced past the PR's fork point. This would fail-close
          # every PR where base moved forward. Full fetch is required.
          git fetch origin "$BASE_SHA" || {
            echo "::error::Failed to fetch base SHA $BASE_SHA"
            exit 1
          }

          # Compute merge-base — fail-closed (no || true)
          MERGE_BASE=$(git merge-base HEAD "$BASE_SHA")
          if [ -z "$MERGE_BASE" ]; then
            echo "::error::Failed to compute merge-base between HEAD and $BASE_SHA"
            exit 1
          fi
          echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"
          echo "Merge base: $MERGE_BASE"
          cd "$GITHUB_WORKSPACE"

      - name: Install Droid CLI
        run: |
          set -euo pipefail
          # 宿主候选择优（D1-c）：扫描两条安装路径（/usr/local/bin/droid +
          # ~/.local/bin/droid），语义化版本比较选最新——不再 first-on-PATH
          # 锁死旧版（先例事故：宿主 0.221 早于用户级 0.228 被命中，服务端
          # 撤销 0.221 支持后三次路径 0 字节 stderr 静默死亡）。同版本并列取
          # 先（PATH 顺序，宿主 provisioning 为准）。背景（host-first 由来，
          # PR #53）：Factory CLI 下载脚本是 [REDACTED-HOST] 出口拓扑下最后一条非镜像
          # 下载路径——PR #52 review-shard 被 runner shutdown 杀死在下载中、
          # PR #61 首轮同因红（rerun 自愈）。候选非空零外网下载；双路径皆
          # 缺失时 fallback 原 curl 下载路径（GitHub-hosted 兼容）。
          HOST_CANDIDATES="/usr/local/bin/droid $HOME/.local/bin/droid"
          BEST_PATH=""
          BEST_MAJOR=-1
          BEST_MINOR=-1
          for CAND in $HOST_CANDIDATES; do
            [ -x "$CAND" ] || continue
            CAND_TEXT="$("$CAND" --version 2>/dev/null | head -1 | grep -oE '[0-9]+(\.[0-9]+)*' | head -1)" || true
            CAND_MAJOR="${CAND_TEXT%%.*}"
            case "$CAND_MAJOR" in ''|*[!0-9]*) CAND_MAJOR=0 ;; esac
            CAND_MINOR="${CAND_TEXT#*.}"
            CAND_MINOR="${CAND_MINOR%%.*}"
            case "$CAND_MINOR" in ''|*[!0-9]*) CAND_MINOR=0 ;; esac
            if [ "$CAND_MAJOR" -gt "$BEST_MAJOR" ] || { [ "$CAND_MAJOR" -eq "$BEST_MAJOR" ] && [ "$CAND_MINOR" -gt "$BEST_MINOR" ]; }; then
              BEST_PATH="$CAND"
              BEST_MAJOR="$CAND_MAJOR"
              BEST_MINOR="$CAND_MINOR"
            fi
          done

          if [ -z "$BEST_PATH" ]; then
            echo "::warning::droid not found on host, falling back to download"
            # --max-time 300：INFRA-613 运维插曲——[REDACTED-HOST] 两次 Install
            # Droid CLI 45min 挂死（rerun 沿用旧定义快照走 fallback 下载，curl
            # 无总超时直落到 runner shutdown）。retry 只管连接级，管不住传输出
            # 半吊子后停摆；max-time 兜底整条命令，配合 --retry 在 5×300s 窗口
            # 内自救，仍失败则快速红灯而非挂死。
            curl --retry 5 --retry-delay 2 --retry-all-errors --max-time 300 -fsSL https://app.factory.ai/cli | sh
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            BEST_PATH="$HOME/.local/bin/droid"
            FALLBACK_DOWNLOADED=1
          fi

          # （D1-c 追加，scrutiny r1）：选择支配执行——当前 PATH 的裸 droid 若
          # 未解析到被选二进制（双路径漂移时解析到旧份，或唯一候选不在 PATH
          # 时解析为空），把选中目录前插 GITHUB_PATH，使同 job 后续步骤
          # （run_shard.sh 的裸 `command -v droid`/`droid exec`）解析到被选
          # 二进制（先例：宿主 0.221 锁死、用户级 0.228 被绕过的静默死亡
          # 场景）。已命中被选路径则零写入（幂等）；fallback 分支已显式写入
          # 下载落点，置位跳过防重复条目。
          # 防降级守卫（scrutiny r2）：候选清单只有两条硬编码安装路径，PATH
          # 若解析到第三路径的更新 droid（如 /opt 预装 0.240），无条件前插
          # 会把执行面从新版降到被选旧版——stale-PATH-wins 的修复不能变成
          # newer-PATH-loses。解析份语义更新时跳过写入并打告警（warn-only，
          # 与 D1-e 哲学一致：漂移可见、不静默降级）；解析份版本不可解析按
          # 0 处理（坏份被被选二进制遮蔽，符合候选择优同款语义）。
          RESOLVED_DROID="$(command -v droid 2>/dev/null || true)"
          PREPEND_SELECTION="true"
          if [ -n "$RESOLVED_DROID" ] && [ "$RESOLVED_DROID" != "$BEST_PATH" ]; then
            RES_TEXT="$("$RESOLVED_DROID" --version 2>/dev/null | head -1 | grep -oE '[0-9]+(\.[0-9]+)*' | head -1)" || true
            RES_MAJOR="${RES_TEXT%%.*}"
            case "$RES_MAJOR" in ''|*[!0-9]*) RES_MAJOR=0 ;; esac
            RES_MINOR="${RES_TEXT#*.}"
            RES_MINOR="${RES_MINOR%%.*}"
            case "$RES_MINOR" in ''|*[!0-9]*) RES_MINOR=0 ;; esac
            if [ "$RES_MAJOR" -gt "$BEST_MAJOR" ] || { [ "$RES_MAJOR" -eq "$BEST_MAJOR" ] && [ "$RES_MINOR" -gt "$BEST_MINOR" ]; }; then
              PREPEND_SELECTION="false"
              echo "::warning::PATH-resolved droid $RESOLVED_DROID ($RES_TEXT) newer than selected $BEST_PATH ($BEST_MAJOR.$BEST_MINOR) — skip GITHUB_PATH prepend (no downgrade)"
            fi
          fi
          if [ -z "${FALLBACK_DOWNLOADED:-}" ] && [ "$PREPEND_SELECTION" = "true" ] && [ "$RESOLVED_DROID" != "$BEST_PATH" ]; then
            SEL_DIR="$(dirname "$BEST_PATH")"
            echo "✓ Selection-dominant: prepending $SEL_DIR to GITHUB_PATH (bare droid → $BEST_PATH)"
            echo "$SEL_DIR" >> "$GITHUB_PATH"
          fi

          # 生效路径与版本打印（D1-e，与 run_shard.sh 分类时点打印呼应）
          EFFECTIVE_TEXT="$("$BEST_PATH" --version 2>/dev/null | head -1 | grep -oE '[0-9]+(\.[0-9]+)*' | head -1)" || true
          EFFECTIVE_TEXT="${EFFECTIVE_TEXT:-unknown}"
          echo "✓ Effective droid CLI: $BEST_PATH (version $EFFECTIVE_TEXT)"
          # 下限 0.200：低于下限仅告警不阻断（D1-e；floor 判定 MAJOR>0 或 MINOR>=200）
          EFF_MAJOR="${EFFECTIVE_TEXT%%.*}"
          case "$EFF_MAJOR" in ''|*[!0-9]*) EFF_MAJOR=0 ;; esac
          EFF_MINOR="${EFFECTIVE_TEXT#*.}"
          EFF_MINOR="${EFF_MINOR%%.*}"
          case "$EFF_MINOR" in ''|*[!0-9]*) EFF_MINOR=0 ;; esac
          if [ "$EFF_MAJOR" -gt 0 ] || [ "$EFF_MINOR" -ge 200 ]; then
            : # floor satisfied
          else
            echo "::warning::host droid $EFFECTIVE_TEXT ($BEST_PATH) < 0.200 — warn-only, not blocking (D1-e)"
          fi

      - name: Sync BYOM action from PR head
        # engine checkout ref = workflow_sha（main pin），action 新增于 PR head——
        # 先把 head-src 的 action 目录同步到 engine/，防 main 上不存在该 action。
        # LLM 链路配置属基础设施（非被评审内容），允许 head 版本生效。
        run: |
          set -euo pipefail
          if [ -d head-src/.github/actions/setup-byom-go-github ]; then
            mkdir -p engine/.github/actions/setup-byom-go-github
            cp head-src/.github/actions/setup-byom-go-github/action.yml \
               engine/.github/actions/setup-byom-go-github/action.yml
          else
            echo "::warning::head-src 无 setup-byom-go-github action（旧 PR？），沿用 engine 版"
          fi

      - name: Setup BYOM (go-github / DeepSeek V4.1 Flash)
        # 凭证只经 action inputs（用户裁定 2026-09-21：BYOM 配置收敛 composite
        # action，不允许 job env 携带凭证）。链路详情见 action.yml 头注。
        # reusable 场景 engine checkout 在 engine/，action 从 engine 副本取
        # （与脚本同源同版本，防 pin 漂移）。
        uses: ./engine/.github/actions/setup-byom-go-github
        with:
          opencode-go-key: ${{ secrets.opencode_go_key }}
          go-github-run-token: ${{ secrets.go_github_run_token }}
          # Worker 层 CI_KEY 门禁头（2026-09-27 F2）：REQUIRE_CI_KEY=true 后
          # x-ci-key 为过 droid-review-gateway Worker 的唯一通行证。
          worker-ci-key: ${{ secrets.worker_ci_key }}

      - name: Pre-check credentials
        env:
          FACTORY_API_KEY: ${{ secrets.factory_api_key }}
        run: |
          set -euo pipefail
          echo "Verifying Factory API credentials before review..."
          if [ -z "$FACTORY_API_KEY" ]; then
            echo "::error::FACTORY_API_KEY secret is empty or not configured."
            exit 1
          fi
          echo "Secret is present (length: ${#FACTORY_API_KEY} chars)."

      - name: Run shard review
        env:
          FACTORY_API_KEY: ${{ secrets.factory_api_key }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 引擎副本（engine checkout）；CWD 保持消费仓 BASE 工作区：
          # run_shard.sh 从 CWD 读取 .github/review/shard-review-prompt.md、
          # head-src/ diff 上下文，并把 findings 写到工作区根目录。
          # schema 校验的 validate_findings 由脚本自身目录解析（引擎自包含）。
          # LLM 链路配置属基础设施：若消费仓 head 带 BYOM_MODEL env 版引擎脚本
          # （head-src/src/infra_core/engine/...），优先覆盖，防 BASE/引擎 pin
          # 旧脚本硬编码模型与 head settings.json 失配瞬败。
          if [ -f head-src/src/infra_core/engine/droid_review/run_shard.sh ]; then
            cp head-src/src/infra_core/engine/droid_review/run_shard.sh \
               engine/src/infra_core/engine/droid_review/run_shard.sh
          fi
          # H1 六件套 ②（h1-classify-capture）：失败分类/脱敏采集助手随引擎副本
          # 同步（head 优先）——run_shard.sh 对缺助手以 || true 容忍（诊断面退化
          # 而非红线），这里同步保证 stale pin 下诊断面仍完整。
          for _h in classify_shard_failure.sh capture_host_log.sh redact_secrets.sh; do
            if [ -f "head-src/src/infra_core/engine/droid_review/$_h" ]; then
              cp "head-src/src/infra_core/engine/droid_review/$_h" \
                 "engine/src/infra_core/engine/droid_review/$_h"
            fi
          done
          bash engine/src/infra_core/engine/droid_review/run_shard.sh

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: droid-review-debug-${{ github.run_id }}-shard-${{ matrix.shard.shard_id }}
          # H1 六件套 ②（h1-classify-capture，圆3 暴露面收敛）：artifact 只携带
          # 脱敏内容——未脱敏全量 stderr（shard-exec-error.log）与 session jsonl
          # （.factory/sessions/**）不再上传。失败诊断改由 run_shard.sh 失败出口
          # 产的 error-classification.txt（七类指纹分类）+ droid-host-log-redacted.txt
          # （宿主日志 MetaError/版本/路由行，Bearer/sk-/x-ci-key/apiKey →
          # [REDACTED]，上限 50 行）承担；droid exec 失败原文仅在 run 页 job log
          # 可见（GitHub 日志自带 secret masking）。前缀契约不变
          # （droid-review-debug-，watchdog quota-sweep 消费；429 特征现从
          # droid-host-log-redacted.txt 与 error-classification.txt 判读）。
          path: |
            findings-shard-*.json
            shard-*.diff
            droid-exec-stdout.json
            prompt.md
            shard-env.log
            error-classification.txt
            droid-host-log-redacted.txt
          retention-days: 7
