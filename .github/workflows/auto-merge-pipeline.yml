# Auto Merge Pipeline — reusable resolve+triage+merge pipeline（M4 门禁切换，gate-watchdog-automerge）
#
# 被两路 caller 调用：memory-core 等 auto-merge thin caller + 自仓触发壳
# auto-merge.yml（B-2 收敛后，本仓内联形态收敛为壳）。本文件单源承载
# resolve / auto-merge（triage + behind/conflicting/stalled 分支处理 + merge）
# 两个 job 的执行体。
#
# 触发面归 caller（VAL-GATE-106 契约）：
#   - workflow_run 名单 ["CI", "QA", "Droid Auto Review", "Evolution
#     Governance", "Quality Gate"]
#   - pull_request_target / schedule / workflow_dispatch
#   - 事件门控（workflow_run 仅 conclusion==success 才尝试合并）在 caller 的
#     调用 job if 求值（github 事件上下文只在 caller 存在）——本文件不引用
#     具体事件守卫，防止双份守卫漂移。
#   - workflow 级 concurrency（group: auto-merge-pipeline）同样归 caller。
#
# INFRA-212（为什么是 workflow_run + schedule 而非 check_run）：GitHub 为防止
# 递归调用，不会把 check_run/check_suite 事件投递给 GitHub Actions 产生的
# check——全绿自动合并只能靠 workflow_run 快路径 + schedule 兜底 + 两个
# 即时事件收敛。语义解释保留在 caller 文件。
#
# 零红铁律（2026-08-28 用户裁定；v3.2.2 §3.2 三门 REST 绿判修订；round-2 #6/#7 实例选择 fail-closed 修订）：
#   绿判唯一入口 = REST check-runs(head_sha) 三门（substrate-gate-suite /
#   quality-gate / droid-review）各取「全部实例（不按 status 预过滤）」中
#   started_at 最新者（null 视为最新），仅当该实例 completed 且 conclusion
#   全 success 才算绿；statusCheckRollup 仅辅助 pending（未报齐 → wait）。
#   mergeable 禁止走 rollup 绿判——SKIPPED≈required 通过 + any(SUCCESS)
#   旁路 SUCCESS 即 #372 假绿合入根因。triage 的 REST 三门绿判 + auto-merge
#   action（本仓 actions/auto-merge）的三门前置门 + 旁路层全 check-runs 零红
#   扫描，多层保证。不得只查 required contexts。
#
# Self-hosted 共享工作区防毒铁律（2026-08-28 三 runner 污染事故）：
#   本 workflow 所有 job 严禁 actions/checkout、严禁任何 sparse-checkout——
#   共享持久 _work 工作区上 checkout 的 sparse 参数会把该工作区写成
#   core.sparseCheckout=true 并裁剪工作树，同一 runner 后续所有复用该工作区
#   的 job 将以 "Can't find action.yml under .github/actions/setup-venv" 失败。
#   triage 脚本经 heredoc 内联写入 RUNNER_TEMP（每 run 独立临时目录，与
#   src/infra_core/shell/auto_merge_triage.sh 逐字节同步，
#   tests/test_auto_merge_workflow_contract.py 锁定两份载体字节一致）。
#   workspace guard 残缺探针用 pyproject.toml（消费仓共有文件，避免本仓
#   特有路径探针导致消费仓每 run 全量重克隆——droid-review-shards 先例）。
#
# 与自仓触发壳 auto-merge.yml 的凭证传递契约：
#   合并凭证经 workflow_call secrets（dispatch_token）显式传入——reusable
#   不隐式继承 caller secrets，caller 以
#   `dispatch_token: ${{ secrets.DISPATCH_TOKEN }}` 传入（snake 单形态键）。
#   merge action 已于 M6 收编为本仓 actions/auto-merge（VAL-HARD-104，
#   shared-workflows 仓退役：README 重定向 + 归档）。

name: Auto Merge Pipeline

on:
  workflow_call:
    secrets:
      # Snake-only 声明（SNAKE-CONVERGENCE）：统一采用 snake_case 键名，
      # 消除 hyphen 变体过渡形态，保持接口简洁。
      dispatch_token:
        description: '合并/更新分支/评论凭证（caller 侧 DISPATCH_TOKEN PAT，不受 GITHUB_TOKEN 递归抑制）'
        required: true

# 2026-09-19 governance（VAL-CORE-004）：权限下放 job 级。顶层只留 read 基线
# （INFRA-688 兜底语义保持）；write 面收窄到实际执行的 job。GITHUB_TOKEN 在
# 两 job 的实际消费都是 gh pr list/view（read）；合并/评论/更新分支全部经
# dispatch_token（PAT）。job 级 write 声明保持原顶层语义（最坏情况兜底：
# 某步漏带显式凭证时不静默 403），行为与下放前等价。
permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  # ── Job 0: 引擎消费授权门（m6-engine-authorization-gate）──
  # 判定：本仓 repo variable ENGINE_CONSUMERS 含 authorized 令牌即放行；
  # 引擎仓 hdot123/infraro-core-mirror 自身豁免。未授权 → fail-loud（下游 job 因
  # needs 不启动）。凭证面：GITHUB_TOKEN 只读 actions:read，不消费 PAT。
  # 秒级 job，不延长管线。
  #
  # 形态裁定（INFRA-1317，2026-10-05 P0 回归第二轮实证）：判定脚本内联在
  # 本 job——composite action（./.github/actions/engine-authorization-gate）
  # 在零 checkout 载体上连 action.yml 自身都无法解析（run 37305718689：
  # "Can't find 'action.yml' ... Did you forget to run actions/checkout"，
  # 本 job 零 checkout 是 self-hosted 共享工作区防毒铁律，不可破）；reusable
  # 形态则被嵌套调用拒绝（startup_failure，PR #262 前实证）。内联 run 是
  # 零 checkout 载体唯一可解析形态；判定脚本四载体逐字节一致（本文件 /
  # droid-review-shards.yml / branch-cleanup.yml / 消费仓模板，契约测试
  # test_all_carrier_scripts_byte_identical_after_dedent 锁定，改一处必须
  # 四处同改）。composite action 目录已删除（防单源歧义）。
  authorization-gate:
    name: authorization-gate
    runs-on: [pve-linux]
    timeout-minutes: 3
    permissions:
      actions: read
    steps:
      - name: Verify engine consumer authorization
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.event.repository.full_name || github.repository }}
          VARS_VALUE: ${{ vars.ENGINE_CONSUMERS || '' }}
        run: |
          set -euo pipefail

          # 引擎授权门（engine authorization gate）——消费仓未授权时在管线入口
          # fail-loud，不静默跳过。判定链：
          #   ① 引擎仓自身豁免（默认 hdot123/infraro-core-mirror）
          #   ② 优先用 vars 上下文值（caller 仓 repo variable，零权限、零 API 调用）
          #   ③ 回退 gh api 读 repo variable（需 token 具备 Variables 读权限；
          #      GITHUB_TOKEN 实测无该权限 → 403，故仅作回退/诊断路径）
          #   ④ 未授权 / 读取失败 → 失败（fail-closed，不静默放行）
          REPO="${REPO:-${GITHUB_REPOSITORY:-}}"
          VARS_VALUE="${VARS_VALUE:-}"
          VARIABLE_NAME="${ENGINE_AUTHORIZATION_VARIABLE:-ENGINE_CONSUMERS}"
          AUTHORIZED_TOKEN="${ENGINE_AUTHORIZATION_TOKEN:-authorized}"
          EXEMPT_REPOS="${ENGINE_AUTHORIZATION_EXEMPT_REPOS:-hdot123/infraro-core-mirror}"
          ALERT="未授权消费引擎，走授权流程"

          if [ -z "${REPO}" ]; then
            echo "::error::${ALERT}：无法解析本仓 full_name（REPO / GITHUB_REPOSITORY 均为空）"
            exit 1
          fi

          for exempt in ${EXEMPT_REPOS}; do
            if [ "${REPO}" = "${exempt}" ]; then
              echo "Authorization gate: ${REPO} 是引擎仓自身，豁免授权检查（exempt）"
              exit 0
            fi
          done

          matches_token() {
            IFS=',' read -r -a TOKENS <<<"$1" || true
            for token in "${TOKENS[@]:-}"; do
              if [ "$(printf '%s' "${token}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')" = "${AUTHORIZED_TOKEN}" ]; then
                return 0
              fi
            done
            return 1
          }

          if matches_token "${VARS_VALUE}"; then
            echo "Authorization gate: ${REPO} authorized（${VARIABLE_NAME}=${VARS_VALUE} @vars）"
            exit 0
          fi

          RAW="$(mktemp)"
          rc=0
          gh api "repos/${REPO}/actions/variables/${VARIABLE_NAME}" >"${RAW}" 2>&1 || rc=$?
          if [ "${rc}" -eq 0 ]; then
            VALUE="$(jq -r '.value // ""' <"${RAW}")"
            rm -f "${RAW}"
            if matches_token "${VALUE}"; then
              echo "Authorization gate: ${REPO} authorized（${VARIABLE_NAME}=${VALUE} @api）"
              exit 0
            fi
            echo "::error::${ALERT}：${REPO} 的 ${VARIABLE_NAME} 当前值为 '${VALUE}'，未包含授权令牌 '${AUTHORIZED_TOKEN}'"
            exit 1
          fi

          if grep -q "404" "${RAW}"; then
            echo "::error::${ALERT}：${REPO} 未设置 repo variable ${VARIABLE_NAME}（vars 上下文值亦为空；授权四步：variable → PAT → runner → 6 阶段验收）"
          else
            echo "::error::${ALERT}：${REPO} 授权状态不可读（vars 上下文值为空，rc=${rc}）：$(head -c 400 "${RAW}")"
          fi
          rm -f "${RAW}"
          exit 1
  resolve:
    needs: authorization-gate
    name: Resolve candidate PRs
    runs-on: [pve-linux]
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    outputs:
      pr_numbers: ${{ steps.resolve.outputs.pr_numbers }}
    steps:
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_PR: ${{ github.event.inputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Event: $EVENT_NAME"

          # v3.2.2 §3.4 FIFO 双保险之截断腿：pr_numbers 输出前按 created_at
          # 截 behind=1。多候选 sweep 才需要截断——单 PR 事件
          # （pull_request_target / 指定 pr_number 的 dispatch）天然是 FIFO
          # 头，免截断。behind 分类仅用 mergeStateStatus（与 triage
          # classify_pr 的 behind 判定同优先级面，无需 REST 三门绿判），
          # 一次 gh pr list 全量取回，无 N+1；createdAt 缺失按空串排序 =
          # 视为最旧（fail-open，只影响相互排序）。截断前先做 update-branch
          # 资格过滤（round-1 P1-2）：fork（isCrossRepository=true，head 仓
          # 无写权限）与 do-not-merge（标签逃生舱）不可 update-branch，剔出
          # behind 槽位竞争面——否则最老的不可收敛 PR 永占 behind=1 槽，可
          # 收敛候选被无限期饿死。被截掉的 behind 候选等下一轮 sweep 收敛
          # （老候选 update-branch 触发重跑再 sweep，先来先服务）。截断失败
          # 降级：fleet 状态取数失败（网络/API 抖动）时保持原列表——单飞腿
          # 仍串行合并，只损失 FIFO 严格性，不产生并发写。双保险之单飞腿 =
          # merge matrix max-parallel:1。
          truncate_fleet() {
            local prs="$1"
            local count fleet_state
            count=$(echo "$prs" | jq 'length')
            if [ "$count" -lt 2 ]; then
              echo "$prs"
              return
            fi
            if ! fleet_state=$(gh pr list --repo "$REPO" --state open --json number,mergeStateStatus,createdAt,isCrossRepository,labels 2>/dev/null); then
              echo "::warning::fleet state fetch failed; skipping behind truncation (max-parallel:1 still serializes)" >&2
              echo "$prs"
              return
            fi
            echo "$prs" | jq -c --argjson fleet "$fleet_state" '
              [ .[] | . as $n
                | ($fleet[] | select(.number == $n)) as $f
                | {number: $n,
                   behind: ($f.mergeStateStatus == "BEHIND"),
                   created: ($f.createdAt // ""),
                   eligible: (
                     ($f.isCrossRepository // false | not)
                     and ([($f.labels // [])[] | ((.name // "") | ascii_downcase)] | index("do-not-merge")) == null
                   )} ]
              | [ .[] | select(.behind and .eligible | not) | .number ] as $keep
              | [ .[] | select(.behind and .eligible) ] | sort_by(.created) | .[0:1] | map(.number) as $oldest
              | ($keep + $oldest)
            '
          }

          case "$EVENT_NAME" in
            pull_request_target)
              if [ -n "$PR_NUMBER" ]; then
                echo "pr_numbers=[\"$PR_NUMBER\"]" >> "$GITHUB_OUTPUT"
              fi
              ;;
            workflow_dispatch)
              if [ -n "$MANUAL_PR" ]; then
                echo "pr_numbers=[\"$MANUAL_PR\"]" >> "$GITHUB_OUTPUT"
              else
                # 未指定 PR 号：扫描所有 open PR
                PRS=$(gh pr list --repo "$REPO" --state open --json number --jq '[.[].number]')
                PRS=$(truncate_fleet "$PRS")
                echo "pr_numbers=$PRS" >> "$GITHUB_OUTPUT"
              fi
              ;;
            workflow_run)
              # 按完成工作流的 head SHA 反查关联的 open PR
              PRS=$(gh pr list --repo "$REPO" --state open --json number,headRefOid \
                    --jq "[.[] | select(.headRefOid == \"$WR_HEAD_SHA\") | .number]")
              PRS=$(truncate_fleet "$PRS")
              echo "pr_numbers=$PRS" >> "$GITHUB_OUTPUT"
              ;;
            schedule)
              PRS=$(gh pr list --repo "$REPO" --state open --json number --jq '[.[].number]')
              PRS=$(truncate_fleet "$PRS")
              echo "pr_numbers=$PRS" >> "$GITHUB_OUTPUT"
              ;;
          esac

  auto-merge:
    name: Auto-merge PR
    needs: resolve
    if: needs.resolve.outputs.pr_numbers != '' && needs.resolve.outputs.pr_numbers != '[]'
    runs-on: [pve-linux]
    # 2026-09-19 governance（VAL-CORE-004）：原顶层权限原样下放（write 面唯一
    # 消费 job；合并凭证仍经 dispatch_token PAT，此声明为兜底语义）。
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
    # INFRA-416：限定单腿时长。triage 各分支都是有界 API 调用，10 分钟
    # 足够；防止 gh/网络挂死导致 matrix 腿永久占位（schedule 周期轮换，
    # 旧腿不退出会与新腿堆叠）。
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # v3.2.2 §3.4 FIFO 双保险之单飞腿：merge/update-branch 均是 main 上的
      # 远端写，必须逐个执行（修订对 max-parallel:5 的旧 pin；截断腿在
      # resolve 输出前，见 truncate_fleet）。测试锁定 max-parallel:1 与截断
      # 同时成立（VAL-M1-005）。
      max-parallel: 1
      matrix:
        pr_number: ${{ fromJSON(needs.resolve.outputs.pr_numbers) }}
    steps:
      # 防毒铁律（self-hosted 共享持久工作区，2026-08-28 三 runner 污染事故）：
      # 本 job 禁止 actions/checkout——triage 脚本经下方 heredoc 内联（与 src/
      # 原件逐字节同步，契约测试锁定），对工作区零写入。本文件所有 job 均不得
      # checkout（契约测试锁定）。
      - name: Workspace guard (sparse residue detox)
        run: |
          set -euo pipefail
          # 自愈向量（2026-08-28 污染事故）：本 job 每 sweep 在 runner 池上轮转，
          # 借此检测并清除工作区 sparse 残留——checkout 自带的 sparse-checkout
          # disable 实证无法恢复被裁剪的工作树（仍缺关键文件）。本步检测残留
          # 并删除 .git 强制全新克隆；必须内联 run——工作树残缺时本地
          # composite action 同样无法解析。探针用 .github/workflows（语言中立）。
          if [ -e "$GITHUB_WORKSPACE/.git" ]; then
            SPARSE_FLAG=$(git -C "$GITHUB_WORKSPACE" config --type=bool --get core.sparseCheckout 2>/dev/null || echo false)
            if [ "$SPARSE_FLAG" = "true" ] || [ ! -d "$GITHUB_WORKSPACE/.github/workflows" ]; then
              echo "::warning::Workspace has sparse/prune residue; removing .git for a clean re-clone"
              rm -rf "$GITHUB_WORKSPACE/.git"
            fi
          fi

      - name: Triage PR mergeable state
        id: triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr_number }}
        run: |
          set -euo pipefail
          # 获取 PR 的 mergeable 状态。
          # mergeable 由 GitHub 异步计算：push 后短暂为 UNKNOWN 属正常。
          # INFRA-416 竞态守卫：resolve 与本步之间 PR 可能已被前序腿合并
          # （FIFO 单飞跨腿竞态仍存在：上一 run 的腿与本 run 的腿），gh pr
          # view 失败（NotFound）时降级为 skip 而非红腿；仅凭状态取不到
          # （非 NotFound 的 API 故障）才 fail。
          # v3.2.2 §3.2：取数含 headRefOid——REST 三门绿判按 head SHA 绑定。
          PR_DATA=""
          for attempt in 1 2 3; do
            if PR_DATA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json number,mergeable,mergeStateStatus,isDraft,statusCheckRollup,labels,headRefOid,createdAt,isCrossRepository 2>&1); then
              break
            fi
            if echo "$PR_DATA" | grep -q "not found\|Could not resolve"; then
              echo "PR #$PR_NUMBER no longer accessible (merged/closed by a parallel leg). Skipping."
              echo "action=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "gh pr view attempt $attempt failed: $PR_DATA"
            PR_DATA=""
            sleep 5
          done
          if [ -z "$PR_DATA" ]; then
            echo "::error::Could not fetch PR #$PR_NUMBER state after 3 attempts"
            exit 1
          fi
          echo "PR data: $PR_DATA"

          # mergeable=UNKNOWN：GitHub 尚未算完。等待后重取一次（通常几秒
          # 内出结果）；仍 UNKNOWN 则 skip，交给 schedule 兜底收敛，
          # 绝不在未知状态猜测动作。
          MERGEABLE=$(echo "$PR_DATA" | jq -r '.mergeable')
          if [ "$MERGEABLE" = "UNKNOWN" ]; then
            sleep 10
            PR_DATA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json number,mergeable,mergeStateStatus,isDraft,statusCheckRollup,labels,headRefOid,createdAt,isCrossRepository)
            echo "PR data after UNKNOWN retry: $PR_DATA"
          fi

          # v3.2.2 §3.2 三门 REST 绿判：在分类前经 REST check-runs(head_sha)
          # 富集 checkRuns 字段（triage 本体零 API 副作用）。读腿失败 → 注入空
          # checkRuns，triage fail-closed 判非绿（绝不退化回 rollup 绿判）；
          # 失败可观测（::warning::）但不红腿，交下一轮 sweep 收敛。
          #
          # Round-2 #8（#381 终局分级）单次捕获归一：旧形态
          # `gh api ... | jq -s ... || echo "[]"` 在 pipefail 下 gh 失败时
          # jq 空 stdin 仍输出 '[]' 且管道非零 → `|| echo "[]"` 同触发 →
          # 命令替换捕获两行 '[]\n[]'：等值比较永不命中（::warning:: 丢失）
          # 且 --argjson 内嵌两行非法 JSON 红腿退出（与「不红腿 fail-closed」
          # 承诺相反，还毒化 head SHA）。修复：先落原始响应（失败显式置单
          # '[]'），归一后再消费——单次捕获，管道与兜底不共存。
          #
          # sh1 P1（PR-C #411 round-1）E2BIG 瘦身：归一化即内联投影到 triage
          # 消费面（gate_latest_completed 只读 id/name/status/conclusion/
          # started_at/not_ready），剥 output.summary/output.text 大字段。
          # not_ready：从 output.title/summary/name 探测 NOT_READY 布尔
          # （FINAL-PLAN §1.2；保留布尔不保留大文本，防 E2BIG）。
          HEAD_SHA=$(echo "$PR_DATA" | jq -r '.headRefOid // empty')
          if [ -n "$HEAD_SHA" ]; then
            CHECK_RUNS_RAW="$RUNNER_TEMP/check_runs_raw.$PR_NUMBER.json"
            if ! gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --paginate > "$CHECK_RUNS_RAW" 2>/dev/null; then
              echo "::warning::REST check-runs read failed for $HEAD_SHA; normalizing to empty (triage will fail-closed to non-green)"
              echo "[]" > "$CHECK_RUNS_RAW"
            fi
            CHECK_RUNS_JSON=$(jq -s '
              [.[] | .check_runs // [] | if type == "array" then .[] else empty end]
              | map(select(.id != null) | {
                  id, name, status, conclusion, started_at,
                  not_ready: (
                    (((.output.title // "") + "\n" + (.output.summary // "") + "\n" + (.name // ""))
                     | test("NOT_READY"))
                  )
                })
            ' "$CHECK_RUNS_RAW" 2>/dev/null || echo "[]")
            rm -f "$CHECK_RUNS_RAW"
            if [ "$CHECK_RUNS_JSON" = "[]" ]; then
              echo "::warning::REST check-runs enrichment slimmed to empty for $HEAD_SHA (triage will fail-closed to non-green)"
            fi
            PR_DATA=$(echo "$PR_DATA" | jq -c --argjson cr "{\"total_count\": $(echo "$CHECK_RUNS_JSON" | jq 'length'), \"check_runs\": $CHECK_RUNS_JSON}" '. + {checkRuns: $cr}')
          else
            echo "::warning::PR #$PR_NUMBER head SHA unavailable; REST three-gate enrichment skipped (fail-closed)"
          fi

          # FIFO 队头只读注入（FINAL-PLAN §2）：唯一写者是 pr-queue-controller。
          # 本步只读 merge-queue 舰队算队头，注入 isQueueHead——禁止快路径自称队头。
          FLEET_JSON=$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,createdAt,labels 2>/dev/null || echo "[]")
          QUEUE_HEAD=$(echo "$FLEET_JSON" | jq -r '
            def names: ((.labels // []) | map(if type == "object" then .name else . end));
            [.[]
              | select(any(names[]; . == "merge-queue"))
              | select(any(names[]; . == "merge-queue-cooldown") | not)
            ] | sort_by(.createdAt // "") | .[0].number // empty
          ')
          if [ -n "$QUEUE_HEAD" ] && [ "$QUEUE_HEAD" = "$PR_NUMBER" ]; then
            IS_HEAD=true
          else
            IS_HEAD=false
          fi
          echo "FIFO queue head=${QUEUE_HEAD:-none}; PR #$PR_NUMBER isQueueHead=$IS_HEAD"
          PR_DATA=$(echo "$PR_DATA" | jq -c --argjson ih "$IS_HEAD" '. + {isQueueHead: $ih}')
          echo "PR data (enriched): $PR_DATA"

          # Self-hosted 共享工作区防毒：triage 脚本不经 checkout 取用，而是
          # 内联写入 RUNNER_TEMP（每 run 独立临时目录，run 结束自动清理）。
          # 下方 heredoc 与 src/infra_core/shell/auto_merge_triage.sh 逐字节
          # 同步——修改分类逻辑时两处必须一起改，契约测试
          # tests/test_auto_merge_workflow_contract.py 锁定字节一致。
          cat > "$RUNNER_TEMP/auto_merge_triage.sh" <<'TRIAGE_EOF'
          #!/usr/bin/env bash
          # Auto-merge triage script (INFRA-416 / INFRA-428 / v3.2.2 §3.2)
          # Classifies PRs by mergeable state, mergeStateStatus and REST three-gate verdict.
          #
          # Input:  JSON array of PRs via stdin (gh pr view/list --json
          #         number,mergeable,mergeStateStatus,isDraft,statusCheckRollup,labels,headRefOid,createdAt,isCrossRepository
          #         + checkRuns: REST check-runs(head_sha) enrichment injected by the caller —
          #         triage 本体零 API 副作用)
          # Output: JSON with 7 categories:
          #           mergeable   (action: merge)
          #           behind      (action: update-branch)
          #           conflicting (action: notify)
          #           pending     (action: wait)
          #           stalled     (action: wait)
          #           unknown     (action: skip)
          #           do_not_merge (action: skip; do-not-merge label escape hatch)
          # Exit:   always 0 (triage never fails workflow)
          #
          # Modes:
          #   default            classify stdin, emit full JSON (behind 类截 behind=1，
          #                      round-6 shard-9 ②：FIFO 合并出口语义)
          #   --get-action N     classify stdin, emit the single action for PR number N
          #                      (merge|update-branch|notify|wait|skip; exit 0; empty or
          #                      invalid input also emits skip — triage must never fail
          #                      the workflow; round-6 shard-9 ②：查询模式不截断——
          #                      被截 behind PR 报真实分类 update-branch)
          #   --get-category N   classify stdin, emit the single category for PR number N
          #                      (mergeable|behind|conflicting|pending|stalled|unknown|
          #                      do_not_merge; missing PR -> unknown; 查询模式不截断，
          #                      同 --get-action). Workflow uses this
          #                      to derive auxiliary outputs (e.g. stalled flag) without
          #                      duplicating classification logic.
          #
          # Green verdict (v3.2.2 §3.2 三门 REST 绿判；round-3 ① 排序键换轴修订):
          #   required_gate_success = REST check-runs(head_sha) 上
          #   substrate-gate-suite / quality-gate / droid-review 三门各取「全部实例
          #   （不按 status 预过滤）」中 check-run id 最新者（id 单调分配永非 null），
          #   仅当该实例 status=completed 且 conclusion=success 才算绿。
          #   mergeable = required_gate_success AND PR mergeable API AND 非 do-not-merge
          #   AND FIFO 队头（见下）。已落定：success|failure；可合并：仅全 success；
          #   skipped/neutral/missing/pending → 非 mergeable。statusCheckRollup 仅辅助
          #   pending；mergeable 判定禁止走 rollup 绿判（#372 假绿根因契约化封堵）。
          #
          # FIFO（FINAL-PLAN §2 / 替换 v3.2.2 §3.4 无序 mergeable）：
          #   三要素：① label 介质 merge-queue（冷却 merge-queue-cooldown）；② 排序键
          #   createdAt；③ 队头唯一写者 = pr-queue-controller（本脚本只读 isQueueHead）。
          #   mergeable 仅队头：须持 merge-queue、无 cooldown、且 isQueueHead==true
          #   （caller 按 label 舰队计算注入；缺字段时 default 模式按本批 createdAt 截 1）。
          #   禁止 mergeable 无序扫合；禁止快路径自称队头直合。
          #   behind=1 截断仍保留（update-branch 单飞）；merge matrix max-parallel:1。
          #   NOT_READY（quality-gate failure + checkRuns[].not_ready）：≠质量红 → pending
          #   （可重试、不升级 stalled 骂街），ruleset 面仍非绿（fail-closed）。
          #
          # Classification precedence (one PR falls into exactly one category,
          # decided by classify_pr in a single pass — categories are exclusive by
          # construction, no cross-select races):
          #   labels contains do-not-merge -> do_not_merge (skip; escape hatch, #314 根因)
          #   mergeable=UNKNOWN    -> unknown     (skip; GitHub still computing)
          #   mergeable=CONFLICTING-> conflicting (notify)
          #   mergeStateStatus=BEHIND -> behind   (update-branch)
          #   isDraft / DRAFT / BLOCKED -> pending (wait)
          #   quality-gate NOT_READY only -> pending (wait; 可重试，不 stalled)
          #   rollup empty or has incomplete checks -> pending (wait; early-fire guard)
          #   rollup reported non-success (stalled leg) -> stalled (wait + escalate)
          #   MERGEABLE + REST 三门全 success + FIFO 队头 -> mergeable (merge)
          #   MERGEABLE + 三门绿但非队头/未入队 -> pending (wait; FIFO)
          #
          # Why these categories exist (INFRA-428):
          # - BLOCKED/DRAFT previously fell into "mergeable" → every 10-min sweep fired
          #   a merge attempt at an un-mergeable PR → red leg + the shared action's own
          #   failure check run poisoned the head SHA (2026-08-18 self-poisoning
          #   deadlock, PR #779 mechanism). wait = benign skip, schedule re-sweeps.
          # - early-fire: pull_request_target(opened) / workflow_run of one workflow
          #   can arrive before all required checks reported. mergeStateStatus alone is
          #   async/cached and can be stale-CLEAN in that window; cross-checking
          #   statusCheckRollup keeps pending until every check run has reported a
          #   conclusion. Rollup empty = no checks reported yet → fail-closed wait
          #   (CI runs on every PR without paths filter, so an empty rollup is
          #   always "checks not reported yet", never "no checks configured").
          # - CONFLICTING wins over BEHIND: a conflicting PR must never be
          #   update-branched into a blind merge.
          # - do-not-merge label wins over everything (escape hatch, #314 事故根因修复):
          #   label 是机器可读的「仅开 PR，不合并」信号，hit 即全腿静默（不 merge、
          #   不 update-branch、不 notify 评论）——最高优先级；移除 label 即恢复候选。
          #   修改前缺这层信号：全绿 sweep 直接卷走在飞 PR（#314 实锤）。

          set -euo pipefail

          GET_ACTION_PR=""
          GET_CATEGORY_PR=""

          MODE="default"
          if [[ "${1:-}" == "--get-action" || "${1:-}" == "--get-category" ]]; then
            MODE="$1"
            if [[ $# -lt 2 ]]; then
              echo "Usage: $0 [--get-action PR_NUMBER | --get-category PR_NUMBER]" >&2
              echo '{"mergeable":[],"behind":[],"conflicting":[],"pending":[],"stalled":[],"unknown":[]}'
              exit 0
            fi
            if [[ "$MODE" == "--get-action" ]]; then
              GET_ACTION_PR="$2"
            else
              GET_CATEGORY_PR="$2"
            fi
          elif [[ $# -gt 0 ]]; then
            echo "Usage: $0 [--get-action PR_NUMBER | --get-category PR_NUMBER]" >&2
            echo '{"mergeable":[],"behind":[],"conflicting":[],"pending":[],"stalled":[],"unknown":[]}'
            exit 0
          fi

          EMPTY_RESULT='{"mergeable":[],"behind":[],"conflicting":[],"pending":[],"stalled":[],"unknown":[],"do_not_merge":[]}'

          # Classify PRs and add action fields.
          # `jq -e` would swallow the classification on unexpected shapes; plain jq
          # with a fallback keeps triage total (empty result on any malformed input).
          #
          # $1 = TRUNCATE ("no-truncate" skips truncate_fleet, see TRUNCATE_FLEET note).
          classify() {
            local TRUNCATE_FLEET="${1:-truncate}"
            jq --argjson truncate "$([ "$TRUNCATE_FLEET" = "truncate" ] && echo true || echo false)" '
              def rollup(pr): (pr.statusCheckRollup // []);
              # 输入防御（round-6 shard-9 ③，round-9 sh9 ① fail-closed 修订）：取数形状
              # 漂移（labels 落成字符串/数字/null）时，labels[] 遍历使整个 jq 程序失败
              # → EMPTY_RESULT → 全部分类静默归零。归一规则必须保持 do-not-merge 真值：
              # 标量字符串按字面值入列、字符串数组条目按字面值入列——round-6 版
              # 「标量 → []」把 "do-not-merge" 字符串漂移静默洗成无标签（逃生门
              # fail-open，PR 误判 mergeable）。仅非字符串标量按「无标签」语义丢弃
              # （防御面 = 防炸穿，不是真值改写）。两处消费
              # （eligible_for_update_branch / has_do_not_merge）走同一归一函数。
              def label_names(pr):
                ((pr.labels // []) |
                  if type == "array"
                  then map(if type == "object" then (.name? // empty) else . end
                           | select(type == "string"))
                  else (if type == "string" then [.] else [] end)
                  end);
              # FIFO truncate（FINAL-PLAN §2）：behind=1；mergeable 再保险只留队头 1。
              # classify_pr 已要求 isQueueHead+merge-queue；此处防批量误入与缺字段回落。
              # 查询模式不截断。
              def eligible_for_update_branch(pr):
                pr as $p
                | (($p.isCrossRepository // false) | not)
                and ((label_names($p) | index("do-not-merge")) == null);
              def has_merge_queue(pr):
                any(label_names(pr)[]; . == "merge-queue")
                and (any(label_names(pr)[]; . == "merge-queue-cooldown") | not);
              def is_fifo_head(pr):
                (pr.isQueueHead // false) == true;
              # 重赋值前先把数组绑到临时变量（|= RHS 上下文是数组本身）。
              def truncate_fleet(result):
                if $truncate then
                  result
                  | (.behind // []) as $b
                  | .behind = ($b
                      | map(select(eligible_for_update_branch(.)))
                      | sort_by(.createdAt // "")
                      | .[0:1])
                  | (.mergeable // []) as $m
                  | .mergeable = (
                      ($m | map(select(is_fifo_head(.) and has_merge_queue(.))) | sort_by(.createdAt // "") | .[0:1])
                      as $explicit
                      | if ($explicit | length) > 0 then $explicit
                        else ($m | map(select(has_merge_queue(.))) | sort_by(.createdAt // "") | .[0:1])
                        end
                    )
                else
                  result
                end;
              # v3.2.2 §3.2 三门 REST 绿判：绿判唯一入口 = REST check-runs(head_sha)
              # （调用方以 checkRuns 字段富集，triage 本体零 API 副作用）。
              # 三门 = substrate-gate-suite / quality-gate / droid-review（Ruleset
              # required 名单）；各取「全部实例（不按 status 预过滤）」中 check-run
              # id 最新者，仅当该实例 status=completed 且 conclusion=success 才算绿。
              # skipped/neutral/missing/pending 一律非绿。checkRuns 缺失/形状异常 →
              # fail-closed 非绿（绝不退化回 rollup 绿判——SKIPPED≈通过 + any(SUCCESS)
              # 旁路 SUCCESS 即 #372 假绿根因）。
              def required_gates: ["substrate-gate-suite", "quality-gate", "droid-review"];
              # jq 函数参数是 call-by-name filter：gate 必须显式 gate as $gate 绑定，
              # 否则 gate 在 map(select(...)) 的元素上下文求值变成 . == . 恒假。
              # round-2 #6/#7 + round-3 ①（#381/#168 终局分级）fail-closed 实例选择：
              # 不得先按 status=="completed" 过滤再取最新——同门更新的 in_progress/queued
              # 实例被忽略会让旧 success 冒充「最新实例」（labeled/ready_for_review 重触发
              # 窗口 → 误合并，fail-open）。排序键 = check-run id（GitHub 单调分配、
              # 永非 null）：started_at/completed_at 都有 null-and-never-populated 语义——
              # 裸 sort_by(started_at) 把 null 排最前（#7：取消实例被旧 success 顶替），
              # 9999 哨兵把 null 一律当最新（round-3 ① #168 类回摆：旧 null-cancelled
              # 永久压制新 success → 永久拒合）。id 唯一同时满足三面：新 in_progress
              # （#6）、新 cancelled（#7）id 更大压制旧 success；旧 null-cancelled
              # id 更小被新 success 取代（①）。
              def gate_latest_completed(pr; gate):
                gate as $gate
                | ((pr.checkRuns // {}) | (.check_runs // []))
                | map(select(.name == $gate and .id != null))
                | sort_by(.id // -9007199254740991)
                | last;
              # 绿判收敛点必须验证最新实例本身 completed+success：最新实例仍在
              # in_progress/queued → 非绿（rollup 未报齐面 → pending，交下一轮 sweep）。
              def required_gate_success(pr):
                all(required_gates[]; gate_latest_completed(pr; .) as $run
                    | $run != null and $run.status == "completed" and $run.conclusion == "success");
              # complete = every check run has reported a grey-green conclusion.
              # has("conclusion") alone is not enough: the rollup of a queued/
              # in_progress check contains "conclusion": null, and jq has() would
              # treat it as reported. Worse, any non-empty STRING counted as reported —
              # so three-gates-green + red bypass leg (FAILURE/CANCELLED/TIMED_OUT)
              # classified mergeable and the stalled branch was unreachable
              # (round-1 P1-1). Grey-green map matches the ci-ok zero-red scan:
              # reported = success/skipped/neutral only; red conclusions are not
              # reported (→ stalled via has_red_conclusion); null/empty = not yet
              # reported (→ pending, early-fire fail-closed).
              # statusCheckRollup 仅辅助 pending（未报齐 → wait），不参与 mergeable。
              # round-3 ②：报齐/红腿判定与绿判同轴——latest-per-name。rollup 条目按
              # 检查名分组取最后出现者（数组序 = GitHub 上报序，与 REST 侧 .id 单调性
              # 同构的时序代理）。any-instance 语义（旧）会把被取代的旧红/旧取消残留
              # 当红腿，绿 PR 永久 stalled（round-2 修复回摆）；只有「同检查名最新
              # 实例」代表该检查的当前状态。无名条目（name null/缺失）共享单桶取
              # 最后者——退化数据保守面，不阻塞有名检查路径。
              def latest_per_name(pr):
                reduce rollup(pr)[] as $item ({}; .[$item.name // ""] = $item);
              def checks_reported(pr):
                (rollup(pr) | length) > 0
                and all(latest_per_name(pr)[];
                  ((.conclusion // "") | ascii_downcase) as $c
                  | $c == "success" or $c == "skipped" or $c == "neutral"
                );
              # 红腿探测（round-1 P1-1 的 stalled 可达性腿 + round-3 ② latest 修订）：
              # 同名旁路检查最新实例红 → stalled（wait + escalate），绝不 mergeable。
              # cancelled 在零红扫描（ci-ok 侧）按编排副作用豁免，但旁路 rollup 上按
              # 红处理——被取消的腿必须以 stalled 显面，而非「已报齐可合并」。
              # 被取代的旧红实例（同检查名后随新实例）不再是红腿——残留红 + 新绿 =
              # 绿（round-2 修复回摆 #381 补丁：any-red-wins 与门判 latest-wins 不同
              # 轴会把绿 PR 永久 stalled）。
              def has_red_conclusion(pr):
                any(latest_per_name(pr)[];
                  ((.conclusion // "") | ascii_downcase) as $c
                  | $c == "failure" or $c == "cancelled" or $c == "timed_out" or $c == "action_required"
                );

              # NOT_READY ≠ 质量红（FINAL-PLAN §1.2）：quality-gate 最新实例 failure 且
              # checkRuns[].not_ready==true → 可重试 pending，不升级 stalled 骂街。
              # ruleset 面仍非绿（required_gate_success 要求 success）。
              def quality_gate_not_ready(pr):
                gate_latest_completed(pr; "quality-gate") as $qg
                | $qg != null
                  and ($qg.status == "completed")
                  and (($qg.conclusion // "") | ascii_downcase) == "failure"
                  and ($qg.not_ready == true);

              # rollup 红若仅反映 quality-gate NOT_READY（无其它红腿名），不当地 stalled。
              def red_only_quality_not_ready(pr):
                quality_gate_not_ready(pr)
                and (
                  [latest_per_name(pr) | to_entries[]
                    | select((.value.conclusion // "" | ascii_downcase) as $c
                        | $c == "failure" or $c == "cancelled" or $c == "timed_out" or $c == "action_required")
                    | .key
                  ] | map(select(. != "quality-gate" and . != "")) | length
                ) == 0;

              # do-not-merge 逃生舱（#314 事故根因修复）：labels 含 do-not-merge（大小写
              # 不敏感）即 do_not_merge。labels 缺失/为空/形状异常 → label_names 兜底为
              # 不命中（round-6 shard-9 ③：labels[] 直接遍历遇标量形状会炸穿整个 jq，
              # 全部分类塌缩 EMPTY_RESULT——分类照常进行；round-9 sh9 ①：字符串形状
              # 的真值不再被洗掉，见 label_names 注释）。
              def has_do_not_merge(pr):
                any(label_names(pr)[]; ascii_downcase == "do-not-merge");

              def classify_pr(pr):
                if has_do_not_merge(pr) then "do_not_merge"
                elif pr.mergeable == "UNKNOWN" then "unknown"
                elif pr.mergeable == "CONFLICTING" then "conflicting"
                elif pr.mergeStateStatus == "BEHIND" then "behind"
                elif (pr.isDraft // false) or pr.mergeStateStatus == "DRAFT" or pr.mergeStateStatus == "BLOCKED" then "pending"
                elif (rollup(pr) | length) == 0 then "pending"
                # NOT_READY：可重试，不 stalled（§1.2）
                elif red_only_quality_not_ready(pr) then "pending"
                # has_red_conclusion 先于 checks_reported：红腿（报齐非灰绿）必须 stalled
                # 可达——旧语义红 conclusion 也算「已报齐」，mergeable 分支把它当 pass-through
                # 吞掉，stalled 永不可达（round-1 P1-1）。
                elif has_red_conclusion(pr) then "stalled"
                # 规格 §3.2 + FIFO：三门绿且队头（merge-queue + isQueueHead）才 mergeable。
                elif required_gate_success(pr) and checks_reported(pr)
                     and has_merge_queue(pr) and is_fifo_head(pr) then "mergeable"
                # 三门绿但未入队/非队头 → FIFO pending（禁止自称队头直合）
                elif required_gate_success(pr) and checks_reported(pr) then "pending"
                elif checks_reported(pr) then "stalled"
                else "pending"
                end;

              def action_for(cat):
                if cat == "mergeable" then "merge"
                elif cat == "behind" then "update-branch"
                elif cat == "conflicting" then "notify"
                elif cat == "do_not_merge" then "skip"
                elif cat == "pending" then "wait"
                elif cat == "stalled" then "wait"
                else "skip"
                end;

              map(. as $pr | {pr: $pr, cat: classify_pr($pr)})
              | {
                  mergeable: [.[] | select(.cat == "mergeable") | .pr + {action: action_for(.cat)}],
                  behind: [.[] | select(.cat == "behind") | .pr + {action: action_for(.cat)}],
                  conflicting: [.[] | select(.cat == "conflicting") | .pr + {action: action_for(.cat)}],
                  pending: [.[] | select(.cat == "pending") | .pr + {action: action_for(.cat)}],
                  stalled: [.[] | select(.cat == "stalled") | .pr + {action: action_for(.cat)}],
                  unknown: [.[] | select(.cat == "unknown") | .pr + {action: action_for(.cat)}],
                  do_not_merge: [.[] | select(.cat == "do_not_merge") | .pr + {action: action_for(.cat)}]
                }
              | truncate_fleet(.)
            ' 2>/dev/null || echo "$EMPTY_RESULT"
          }

          # Read JSON from stdin
          input=$(cat)

          # Handle empty or invalid JSON
          if ! echo "$input" | jq empty 2>/dev/null; then
            echo "Invalid or empty JSON input, returning empty triage result" >&2
            if [[ -n "$GET_ACTION_PR" ]]; then
              echo "skip"
            elif [[ -n "$GET_CATEGORY_PR" ]]; then
              echo "unknown"
            else
              echo "$EMPTY_RESULT"
            fi
            exit 0
          fi

          # round-6 shard-9 ②：查询模式跳过 truncate_fleet——被 FIFO 截掉的 behind PR
          # 在查询面上必须报真实分类（behind/update-branch），否则调用方无法区分
          # 「真 skip」与「本轮被 FIFO 推迟」。default 模式截断语义不变。
          TRIAGE_RESULT=$(echo "$input" | classify "$([ -n "$GET_ACTION_PR$GET_CATEGORY_PR" ] && echo no-truncate || echo truncate)")

          if [[ -n "$GET_ACTION_PR" || -n "$GET_CATEGORY_PR" ]]; then
            # 每类只含互斥子集，按类别优先级查一次即可得到该 PR 的唯一归属
            CATEGORY=$(echo "$TRIAGE_RESULT" | jq -r --argjson pr "${GET_ACTION_PR:-$GET_CATEGORY_PR}" '
              if ([.do_not_merge[] | select(.number == $pr)] | length) > 0 then "do_not_merge"
              elif ([.behind[] | select(.number == $pr)] | length) > 0 then "behind"
              elif ([.conflicting[] | select(.number == $pr)] | length) > 0 then "conflicting"
              elif ([.pending[] | select(.number == $pr)] | length) > 0 then "pending"
              elif ([.stalled[] | select(.number == $pr)] | length) > 0 then "stalled"
              elif ([.mergeable[] | select(.number == $pr)] | length) > 0 then "mergeable"
              else "unknown"
              end
            ')
            if [[ -n "$GET_CATEGORY_PR" ]]; then
              echo "$CATEGORY"
            else
              case "$CATEGORY" in
                behind) echo "update-branch" ;;
                conflicting) echo "notify" ;;
                do_not_merge) echo "skip" ;;
                pending|stalled) echo "wait" ;;
                mergeable) echo "merge" ;;
                *) echo "skip" ;;
              esac
            fi
            exit 0
          fi

          echo "$TRIAGE_RESULT"
          TRIAGE_EOF

          # 分类并提取该 PR 的类别与动作（单 PR 输入，--get-category 即其
          # 类别，workflow 内再映射为 action）。
          # INFRA-428：取数扩展 isDraft + statusCheckRollup，分类新增
          # pending（draft/blocked/checks 未报齐）与 stalled（有 check 失败），
          # action=merge 仅在 REST 三门全 success 时发出，杜绝 early-fire 盲合并。
          # #314 事故根因修复：取数再扩展 labels，分类新增 do_not_merge
          # （do-not-merge label 逃生舱，最高优先级全腿静默）。
          # 零红铁律（v3.2.2 §3.2）：triage 绿判唯一入口 = REST check-runs(head_sha)
          # 三门各取 started_at 最新且 completed、conclusion 全 success；
          # statusCheckRollup 仅辅助 pending；旁路层零红由 merge action 全量扫描兜底。
          CATEGORY=$(echo "$PR_DATA" | jq -s '.[0:1]' | bash "$RUNNER_TEMP/auto_merge_triage.sh" --get-category "$PR_NUMBER")
          case "$CATEGORY" in
            behind) ACTION="update-branch" ;;
            conflicting) ACTION="notify" ;;
            do_not_merge)
              ACTION="skip"
              echo "PR #$PR_NUMBER skipped: do-not-merge label present（逃生舱：仅开 PR 不合并，移除 do-not-merge 标签后恢复自动合并候选）"
              ;;
            pending|stalled) ACTION="wait" ;;
            mergeable) ACTION="merge" ;;
            *) ACTION="skip" ;;
          esac
          STALLED="false"
          if [ "$CATEGORY" = "stalled" ]; then STALLED="true"; fi
          {
            echo "action=$ACTION"
            echo "category=$CATEGORY"
            echo "stalled=$STALLED"
          } >> "$GITHUB_OUTPUT"
          echo "Action: $ACTION (category: $CATEGORY)"

      - name: Handle BEHIND PR (update-branch self-heal)
        if: steps.triage.outputs.action == 'update-branch'
        env:
          GH_TOKEN: ${{ secrets.dispatch_token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr_number }}
        run: |
          set -euo pipefail
          echo "::warning::PR #$PR_NUMBER is BEHIND main, attempting update-branch self-heal"
          # 幂等操作：更新 PR 分支以包含最新 main
          # INFRA-428 竞态守卫：并发腿可能刚完成 update-branch（或 main 又
          # 前进使分支重新 BEHIND）。本腿观察到 BEHIND 但 GitHub 侧已变化
          # 时，gh pr update-branch 会以错误退出（如 "not behind"）——这是
          # 竞态的正常收敛而非故障，降级为绿腿 skip，交给下一轮 sweep。
          if ! gh pr update-branch "$PR_NUMBER" --repo "$REPO"; then
            echo "::warning::update-branch failed for PR #$PR_NUMBER (likely raced with a parallel leg or main moved again). Skipping; next sweep will retry."
            exit 0
          fi
          echo "PR #$PR_NUMBER branch updated, CI will re-run and trigger new workflow_run event"

      - name: Handle CONFLICTING PR (notify)
        if: steps.triage.outputs.action == 'notify'
        env:
          GH_TOKEN: ${{ secrets.dispatch_token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr_number }}
        run: |
          set -euo pipefail
          echo "::error::PR #$PR_NUMBER has merge conflicts (CONFLICTING state)"
          # 幂等通知（INFRA-416）：按 head SHA 粒度去重——同一 head SHA 只发
          # 一次冲突评论，避免 schedule 周期重复刷屏（INFRA-292 教训）。
          # sentinel 随冲突解决后的新 push 自然轮换，无需人工清理。
          # INFRA-428：去重命中后 exit 0——通知已送达即本腿职责完成；此前
          # 的 exit 1 会让未解决冲突的 PR 每轮产生一条永久红腿
          # （失败 run + 注解噪音，且失败 check 落在 head SHA 上持续毒化
          # shared action 的全绿判定）。首次评论失败仍保持 exit 1 红色告警。
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          SENTINEL="<!-- auto-merge-conflict-${HEAD_SHA} -->"
          EXISTING=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json comments --jq '[.comments[].body | select(contains("'"$SENTINEL"'"))] | length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "::warning::Conflict comment already posted for $HEAD_SHA (count: $EXISTING). Skipping duplicate notification."
            exit 0
          fi
          # 添加评论通知 PR 作者（用 heredoc 避免多行中文字符串破坏 YAML）
          read -r -d '' COMMENT_BODY <<'COMMENT_EOF' || true
          ⚠️ **Auto-merge: PR 存在合并冲突（CONFLICTING 状态）**

          此 PR 无法自动合并，需要手动解决冲突：
          1. 拉取最新 main 并合并
          2. 解决冲突并推送
          3. 推送后 auto-merge 会自动重试

          COMMENT_EOF
          COMMENT_BODY="${COMMENT_BODY}${SENTINEL}"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$COMMENT_BODY"
          # 评论送达后仍以非零退出，让 workflow 显示一次红色告警（仅首次；
          # 后续 sweep 由上方去重分支短路为绿腿）
          exit 1

      - name: Handle stalled PR (checks reported non-success)
        if: steps.triage.outputs.action == 'wait' && steps.triage.outputs.stalled == 'true'
        env:
          GH_TOKEN: ${{ secrets.dispatch_token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr_number }}
        run: |
          set -euo pipefail
          # INFRA-428：rollup 已报齐但存在红腿结论（grey-green 判定：success/
          # skipped/neutral 算已报齐的灰绿面，FAILURE/CANCELLED/TIMED_OUT/
          # ACTION_REQUIRED 等红 conclusion 不算已报齐 → stalled）。典型：某个
          # check 失败/取消，或 shared action 自身毒化的 check 卡住 head SHA。
          # 首次发现时以 head SHA sentinel 幂等留一条评论（可见、可追溯、
          # 天然随新 push 轮换），绿腿退出——修复由 PR 作者/droid-review
          # 流程负责，auto-merge 不反复重试也不产生红腿噪音。
          echo "::warning::PR #$PR_NUMBER checks are not all successful (stalled). Not attempting merge."
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          SENTINEL="<!-- auto-merge-stalled-${HEAD_SHA} -->"
          EXISTING=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json comments --jq '[.comments[].body | select(contains("'"$SENTINEL"'"))] | length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "Stalled comment already posted for $HEAD_SHA (count: $EXISTING). Skipping duplicate notification."
            exit 0
          fi
          read -r -d '' COMMENT_BODY <<'COMMENT_EOF' || true
          ⏸️ **Auto-merge: PR 的检查未全部通过（stalled）**

          此 PR 的 check rollup 存在非 SUCCESS 结论，auto-merge 暂停合并并等待：
          - 若 CI/droid-review 失败：请修复后推送，auto-merge 会自动重试
          - 若你认为是残留的失败 check 卡住（如历史毒化）：推送新 commit 或重跑失败 check 即可解除

          COMMENT_EOF
          COMMENT_BODY="${COMMENT_BODY}${SENTINEL}"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$COMMENT_BODY"
          exit 0

      - name: Run auto-merge
        if: steps.triage.outputs.action == 'merge'
        # M6 VAL-HARD-104：merge action 收编为本仓 actions/auto-merge（自原共享仓
        # auto-merge@5a0fc1b 行为等价移植，该仓退役归档）。owner/repo 全路径 +
        # 不可变 tag pin（INFRA-678）：远程 action 由 GitHub 服务端按 ref 解析，
        # 本 job 零 checkout 也可用（防毒铁律不变）；升级 = 显式 bump tag。
        uses: hdot123/infraro-core-mirror/actions/auto-merge@v0.33.0 # #414 REST 三门绿判；pin 与 actions/auto-merge@main 内容等价（test_self_repo_action_refs_content_equivalent）
        with:
          pr-number: ${{ matrix.pr_number }}
        env:
          # 铁律：合并必须用 DISPATCH_TOKEN（caller 经 workflow_call secrets
          # 显式传入），不能用 GITHUB_TOKEN。GitHub 递归防护会抑制
          # GITHUB_TOKEN 操作产生的 push 事件，导致 release-please 的
          # push(paths: .release-please-manifest.json) 触发器失效 → release PR
          # 合并后 tag/Release 不创建、Release Pipeline 断链。
          # 2026-08-15 两次事故（v.29.0 / v.30.0 均靠手动 dispatch 补救）。
          # 采用 snake_case 统一形态。
          GITHUB_TOKEN: ${{ secrets.dispatch_token }}
