name: Feature Request
description: 提议一个新能力或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 该提议解决什么痛点？当前如何绕过？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 期望的行为/接口形态。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 影响面
      options:
        - 引擎核心（src/infra_core/engine）
        - CLI（infra-cli）
        - CI/workflow 治理
        - substrate 门禁
        - 发版公告链路
        - 其他/不确定
    validations:
      required: false
